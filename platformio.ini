; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; The filesystem image is assembled by build.py rather than taken straight from
; data/: every asset is gzipped and the vendored browser libraries are folded in
; (see vendor/README.md). data/ stays the editable source.
data_dir = .pio/wwwdist

[env:esp32dev]
; Pinned to an explicit pioarduino release URL rather than a bare
; `espressif32@<version>` requirement. Espressif's own registry package
; stalled at 6.x, and the pioarduino fork (which is what actually supports
; the current Arduino-ESP32 core this project builds against) is not
; published under that name on the default PlatformIO registry - so a bare
; version requirement resolves only on machines that already have the fork
; installed, and fails in CI with "Could not find the package with
; 'espressif32 @ ...' requirements". The full URL resolves identically
; everywhere.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32dev
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
monitor_filters = esp32_exception_decoder
extra_scripts = build.py
framework = arduino

lib_deps =
	https://github.com/tzapu/WiFiManager.git@2.0.17
	https://github.com/ESP32Async/ESPAsyncWebServer.git@^3.7.4
	https://github.com/adafruit/Adafruit_SSD1306.git@^2.5.13
	waspinator/AccelStepper@^1.64
	bblanchon/ArduinoJson@^5.13.4
	adafruit/Adafruit NeoPixel@^1.12.3

; ---------------------------------------------------------------------------
; Advanced motion feature builds
;
; These environments exist so the optional, hardware-UNTESTED features gated
; behind MURAL_TMC_UART / MURAL_SMOOTH_MOTION (see src/movement.*,
; src/runner.cpp, src/tasks/interpolatingmovementtask.*,
; src/phases/retractbeltsphase.*, docs/tmc-uart.md, docs/motion-smoothing.md)
; can be compile-checked in CI. The default env:esp32dev above is unaffected.
; MURAL_SMOOTH_MOTION has since been flashed to and run on real hardware;
; MURAL_TMC_UART has not.
; ---------------------------------------------------------------------------

; Same firmware as env:esp32dev, uploaded over WiFi (ArduinoOTA) instead of
; USB. Requires the OTA partition table + ArduinoOTA support to already be on
; the board (one USB flash of env:esp32dev after they landed), then:
;   pio run -e esp32dev-ota -t upload     (firmware)
;   pio run -e esp32dev-ota -t uploadfs   (web UI / LittleFS image)
;
; This builds the DEFAULT firmware. On a board running one of the flag builds
; below, updating through here silently reverts it to plain esp32dev - use that
; build's own -ota environment instead. (uploadfs is flag-independent: the
; filesystem image is the same whichever firmware is on the board. It does
; replace the whole partition, so it also erases any uploaded /commands.)
[env:esp32dev-ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = mural.local

[env:esp32dev-tmcuart]
extends = env:esp32dev
build_flags = -DMURAL_TMC_UART
lib_deps =
	${env:esp32dev.lib_deps}
	teemuatlut/TMCStepper@^0.7.3

[env:esp32dev-smooth]
extends = env:esp32dev
build_flags = -DMURAL_SMOOTH_MOTION

; env:esp32dev-smooth over WiFi. Exists so a board running the smooth build can
; be updated wirelessly without quietly dropping back to the default firmware,
; which is what env:esp32dev-ota above would do.
[env:esp32dev-smooth-ota]
extends = env:esp32dev-smooth
upload_protocol = espota
upload_port = mural.local
