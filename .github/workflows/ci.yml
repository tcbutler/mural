name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware:
    name: Firmware build + flash-budget gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Install littlefs-python (for flash-budget gate)
        run: pip install littlefs-python

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Build firmware
        run: pio run

      - name: Build filesystem image
        run: pio run -t buildfs

      - name: Check flash-size budgets
        run: python tools/check_sizes.py

  kinematics:
    name: Host kinematics accuracy + parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pure-math host harness: no PlatformIO/Arduino toolchain needed. This was
      # committed red and stayed red because nothing ran it; see the header comment
      # in test/host/parity_test.cpp.
      - name: Build and run kinematics harness
        working-directory: test/host
        run: |
          g++ -std=c++17 -O2 -I../../src ../../src/kinematics.cpp parity_test.cpp -o parity_test
          ./parity_test

  mock-harness:
    name: Mock firmware contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Guards tools/mock_firmware.js against drifting away from the firmware's
      # state document, phase names, endpoints and SSE payload. No toolchain
      # needed - it parses src/ and starts the mock on a scratch port.
      - name: Check mock firmware contract
        run: node tools/mock_contract_test.js

  pipeline:
    name: TS pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tsc
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        # Full install (not --ignore-scripts): "canvas" ships prebuilt Linux
        # x64 binaries fetched by its install script, and the full-pipeline
        # regression tests self-skip when require("paper") can't load canvas.
        # With --ignore-scripts those tests would silently skip forever.
        # Fall back to --ignore-scripts here only if the prebuilt fetch proves
        # flaky on the runner; for local/macOS dev, --ignore-scripts is fine.
        run: npm install

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test
        run: |
          if grep -q "no test specified" package.json; then
            echo "Skipping: test script is still the unimplemented stub."
          else
            npm test --if-present
          fi
